<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusX | Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 228, 240, 0.5);
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary": "#7e3000",
                        "surface-bright": "#fcf8ff",
                        "primary-container": "#4f46e5",
                        "surface-dim": "#dcd8e5",
                        "outline": "#777587",
                        "on-primary-container": "#dad7ff",
                        "surface-container-highest": "#e4e1ee",
                        "surface-container": "#f0ecf9",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb695",
                        "background": "#fcf8ff",
                        "inverse-primary": "#c3c0ff",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "secondary": "#4648d4",
                        "on-surface-variant": "#464555",
                        "on-primary-fixed-variant": "#3323cc",
                        "surface": "#fcf8ff",
                        "surface-variant": "#e4e1ee",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "secondary-fixed-dim": "#c0c1ff",
                        "primary": "#3525cd",
                        "outline-variant": "#c7c4d8",
                        "tertiary-container": "#a44100",
                        "on-secondary-fixed": "#07006c",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#ffd2be",
                        "secondary-container": "#6063ee",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#ffdbcc",
                        "on-primary-fixed": "#0f0069",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "secondary-fixed": "#e1e0ff",
                        "on-secondary-container": "#fffbff",
                        "on-tertiary-fixed": "#351000",
                        "on-background": "#1b1b24",
                        "inverse-on-surface": "#f3effc",
                        "surface-container-low": "#f5f2ff",
                        "primary-fixed": "#e2dfff",
                        "on-surface": "#1b1b24",
                        "inverse-surface": "#302f39",
                        "on-error-container": "#93000a",
                        "surface-tint": "#4d44e3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "xxl": "48px",
                        "margin_mobile": "16px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",

                        "container_max": "1440px"
                    },
                    "fontFamily": {

                        "display": ["Inter"],

                    "fontSize": {

<body class="bg-background text-on-background font-body text-body min-h-screen overflow-x-hidden flex flex-col items-center justify-center relative">
<!-- Subtle Background Atmosphere -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px] animate-float" style="animation-duration: 8s;"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[45%] h-[45%] bg-secondary/10 rounded-full blur-[120px] animate-float" style="animation-delay: -3s;"></div>
<div class="absolute top-[20%] right-[10%] w-[30%] h-[30%] bg-tertiary-fixed/5 rounded-full blur-[100px] animate-float" style="animation-duration: 10s;"></div>
</div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-[480px] px-margin_mobile md:px-0">
<!-- Header / Logo Area -->
<div class="text-center mb-xl">
<div class="inline-flex items-center gap-base mb-md">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-display text-h3 md:text-h2 text-primary tracking-tight">CampusX</h1>
</div>
</div>
<!-- Glassmorphic Form Card -->
<div class="glass-card p-xl rounded-[24px] shadow-2xl shadow-primary/5">
<div class="mb-xl">
<h2 class="font-title text-h3 text-on-surface mb-sm">Reset your password</h2>
<p class="text-on-surface-variant font-body">
                    Enter your student email and we'll send you a link to get back into your account.
                </p>
</div>
<!-- Forgot Password Form -->
<form class="space-y-lg" id="forgot-password-form">
<div class="space-y-xs">
<label class="font-small text-small text-on-surface ml-1" for="email">Student Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-[18px] py-4 pl-12 pr-4 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body placeholder:text-outline-variant" id="email" name="email" placeholder="yourname@university.edu" required="" type="email"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-title py-4 rounded-[18px] shadow-lg shadow-primary/10 transition-all transform active:scale-[0.98] flex items-center justify-center gap-sm" id="submit-btn" type="submit">
<span id="btn-text">Send Reset Link</span>
<span class="hidden animate-spin material-symbols-outlined" id="loader">mobile_share_stack</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="mt-xl pt-lg border-t border-outline-variant/30 text-center">
<a class="inline-flex items-center gap-xs text-primary font-small hover:underline group transition-all" href="#">
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:-translate-x-1">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
<!-- Verification Badge Footer -->
<div class="mt-lg flex items-center justify-center gap-base">
<div class="flex items-center gap-xs bg-surface-container-high/50 px-md py-sm rounded-full border border-outline-variant/30">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="text-caption text-on-surface-variant font-medium">Verified Campus Network</span>
</div>
</div>
</main>
<!-- Success Toast (Hidden by default) -->
<div class="fixed top-xl right-xl z-[100] transform translate-y-[-120%] transition-transform duration-500 ease-out" id="success-toast">
<div class="glass-card px-lg py-md rounded-xl shadow-floating flex items-center gap-md border-l-4 border-primary">
<div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<p class="font-title text-small text-on-surface">Link Sent!</p>
<p class="text-caption text-on-surface-variant">Check your inbox for instructions.</p>
</div>
<button class="ml-base text-outline hover:text-on-surface" onclick="hideToast()">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Micro-interactions Script -->
<script>
        const form = document.getElementById('forgot-password-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('loader');
        const toast = document.getElementById('success-toast');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Sending...';
            loader.classList.remove('hidden');
            
            // Simulate API Call
            setTimeout(() => {
                loader.classList.add('hidden');
                btnText.textContent = 'Link Sent';
                submitBtn.classList.replace('bg-primary', 'bg-tertiary-container');
                showToast();
                
                // Reset after some time
                setTimeout(() => {
                    submitBtn.disabled = false;
                    btnText.textContent = 'Send Reset Link';
                    submitBtn.classList.replace('bg-tertiary-container', 'bg-primary');
                }, 4000);
            }, 1800);
        });

        function showToast() {
            toast.style.transform = 'translateY(0)';
            setTimeout(hideToast, 5000);
        }

        function hideToast() {
            toast.style.transform = 'translateY(-120%)';
        }
    </script>
</body></html>
