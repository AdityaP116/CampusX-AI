<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | CampusX</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Design System Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "tertiary": "#7e3000",
                "on-tertiary-fixed-variant": "#7b2f00",
                "on-secondary-container": "#fffbff",
                "surface-container-lowest": "#ffffff",
                "on-tertiary-container": "#ffd2be",
                "inverse-on-surface": "#f3effc",
                "primary-container": "#4f46e5",
                "on-primary-fixed": "#0f0069",
                "error-container": "#ffdad6",
                "surface": "#fcf8ff",
                "on-secondary-fixed": "#07006c",
                "outline": "#777587",
                "on-secondary": "#ffffff",
                "on-error-container": "#93000a",
                "on-error": "#ffffff",
                "surface-container-highest": "#e4e1ee",
                "on-background": "#1b1b24",
                "secondary-fixed-dim": "#c0c1ff",
                "tertiary-container": "#a44100",
                "surface-container-high": "#eae6f4",
                "on-secondary-fixed-variant": "#2f2ebe",
                "secondary-container": "#6063ee",
                "inverse-primary": "#c3c0ff",
                "primary-fixed-dim": "#c3c0ff",
                "surface-bright": "#fcf8ff",
                "inverse-surface": "#302f39",
                "on-tertiary-fixed": "#351000",
                "primary": "#3525cd",
                "on-primary-fixed-variant": "#3323cc",
                "tertiary-fixed": "#ffdbcc",
                "on-primary-container": "#dad7ff",
                "on-tertiary": "#ffffff",
                "primary-fixed": "#e2dfff",
                "secondary-fixed": "#e1e0ff",
                "surface-tint": "#4d44e3",
                "surface-dim": "#dcd8e5",
                "on-surface": "#1b1b24",
                "surface-variant": "#e4e1ee",
                "secondary": "#4648d4",
                "background": "#fcf8ff",
                "outline-variant": "#c7c4d8",
                "on-primary": "#ffffff",
                "on-surface-variant": "#464555",
                "surface-container-low": "#f5f2ff",
                "tertiary-fixed-dim": "#ffb695",
                "surface-container": "#f0ecf9",
                "error": "#ba1a1a"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "spacing": {
                "md": "16px",
                "margin_mobile": "16px",
                "sm": "8px",
                "gutter": "24px",
                "container_max": "1440px",
                "xxl": "48px",
                "base": "8px",
                "xs": "4px",
                "lg": "24px",
                "xl": "32px"
            },
            "fontFamily": {
                "title": ["Inter"],
                "h2": ["Inter"],
                "display": ["Inter"],
                "caption": ["Inter"],
                "body": ["Inter"],
                "h1": ["Inter"],
                "h3": ["Inter"],
                "h1-mobile": ["Inter"],
                "small": ["Inter"]
            },
            "fontSize": {
                "title": ["20px", {"lineHeight": "1.5", "fontWeight": "600"}],
                "h2": ["32px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "caption": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "400"}],
                "body": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                "h1": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "h3": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                "h1-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                "small": ["14px", {"lineHeight": "1.5", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #f0ecf9, #fcf8ff 50%, #e2dfff 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input-focus:focus {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            border-color: #4f46e5;
        }
    </style>
</head>
<body class="flex items-center justify-center p-gutter overflow-hidden">
<!-- Atmospheric WebGL-like Shader Background (Subtle) -->
<div class="fixed inset-0 z-[-1] opacity-40 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary/10 rounded-full blur-[120px]"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-8 duration-700">
<!-- Logo/Identity -->
<div class="flex flex-col items-center mb-xl">
<div class="w-12 h-12 bg-primary rounded-[14px] flex items-center justify-center shadow-lg mb-md">
<span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h2 class="font-display text-h3 text-on-surface">CampusX</h2>
</div>
<!-- Glassmorphic Login Card -->
<div class="glass-card rounded-[24px] p-xl shadow-xl">
<div class="text-center mb-xl">
<h1 class="font-h2 text-h3 text-on-surface mb-xs">Log in to CampusX</h1>
<p class="font-body text-small text-on-surface-variant">The verified student marketplace</p>
</div>
<form action="#" class="space-y-lg">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-small text-small text-on-surface-variant ml-1" for="email">Student Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">alternate_email</span>
<input class="w-full bg-surface/50 border border-outline-variant/30 rounded-xl py-3.5 pl-12 pr-4 font-body text-body text-on-surface placeholder:text-outline-variant transition-all duration-200 outline-none form-input-focus" id="email" placeholder="name@university.edu" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-small text-small text-on-surface-variant" for="password">Password</label>
<a class="font-small text-small text-primary hover:text-primary-container transition-colors duration-200" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">lock</span>
<input class="w-full bg-surface/50 border border-outline-variant/30 rounded-xl py-3.5 pl-12 pr-12 font-body text-body text-on-surface placeholder:text-outline-variant transition-all duration-200 outline-none form-input-focus" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant transition-colors duration-200" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Login Button (Manual) -->
<button class="w-full bg-surface-container-highest/50 border border-outline-variant/30 text-on-surface font-title text-body py-3.5 rounded-[18px] hover:bg-surface-variant/70 active:scale-[0.98] transition-all duration-200 shadow-sm" type="submit">
                    Sign in
                </button>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/20"></div>
<span class="flex-shrink mx-4 font-caption text-caption text-outline-variant uppercase tracking-widest">or continue with</span>
<div class="flex-grow border-t border-outline-variant/20"></div>
</div>
<!-- SSO Button (Primary style as requested) -->
<button class="w-full bg-primary-container text-on-primary font-title text-body py-3.5 rounded-[18px] hover:bg-primary active:scale-[0.98] transition-all duration-200 shadow-md flex items-center justify-center gap-2 group" type="button">
<span class="material-symbols-outlined text-[20px] group-hover:animate-pulse">verified_user</span>
                    Login with Student ID
                </button>
</form>
<!-- Footer Link -->
<div class="mt-xl text-center">
<p class="font-body text-small text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-title hover:text-primary-container transition-colors duration-200" href="#">Sign up</a>
</p>
</div>
</div>
<!-- Trust Footer -->
<div class="mt-xl flex flex-wrap justify-center gap-x-xl gap-y-md px-md">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-[18px]">verified</span>
<span class="font-caption text-caption text-outline-variant">University Verified</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-[18px]">security</span>
<span class="font-caption text-caption text-outline-variant">Secure Marketplace</span>
</div>
</div>
</main>
<script>
        // Micro-interaction for the form fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#3525cd';
                input.parentElement.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '';
                input.parentElement.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
            });
        });

        // Simple button press animation
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.97)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
