<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-margin_mobile">

</p>

<!-- Verification Form -->
<form class="space-y-xl" id="otp-form">
<!-- 6-Digit OTP Field -->
<div class="flex justify-between gap-2 md:gap-3" id="otp-inputs">
<input aria-label="Digit 1" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-h3 font-h3 bg-surface-container-low border-none rounded-xl focus:bg-surface transition-all duration-200" maxlength="1" type="text"/>

<input aria-label="Digit 3" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-h3 font-h3 bg-surface-container-low border-none rounded-xl focus:bg-surface transition-all duration-200" maxlength="1" type="text"/>
<input aria-label="Digit 4" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-h3 font-h3 bg-surface-container-low border-none rounded-xl focus:bg-surface transition-all duration-200" maxlength="1" type="text"/>

                </button>

                    </p>

<script>
        // OTP Auto-focus Logic
        const inputs = document.querySelectorAll('#otp-inputs input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Prevent non-numeric characters
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Form Submit Simulation
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalContent = submitBtn.innerHTML;
            
            // Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Verifying...
            `;

            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalContent;
                // Interaction: Success visual could go here
            }, 1500);
        });
    </script>
