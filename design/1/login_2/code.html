            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }

        .animate-blob {
            animation: blob-float 15s infinite ease-in-out;

<script>
        // Simple micro-interactions
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const inputs = form.querySelectorAll('input');
            const submitBtn = form.querySelector('button[type="submit"]');

            // Form shake effect on empty submit
            submitBtn.addEventListener('click', (e) => {
                let isValid = true;
                inputs.forEach(input => {
                    if (!input.value) {
                        isValid = false;
                        input.parentElement.classList.add('border-error');
                        setTimeout(() => input.parentElement.classList.remove('border-error'), 1000);
                    }
                });

                if (!isValid) {
                    const card = document.querySelector('.glass-card');
                    card.classList.add('animate-shake');
                    setTimeout(() => card.classList.remove('animate-shake'), 400);
                }
            });

            // Focus interactions handled by Tailwind group-hover/focus classes
        });
    </script>
<style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.1s ease-in-out 0s 3;
        }
    </style>
